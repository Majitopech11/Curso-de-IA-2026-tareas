# Mini cave 4x4 (exercise 1, custom Wumpus layout).
# (1, 1) is the bottom-left cave. The agent starts there, facing east.
# Wumpus and pits were moved far from the classic config (classic_4x4.yaml).

grid:
  width: 4
  height: 4

agent:
  start: [1, 1]
  direction: east
  arrows: 1

wumpus: [4, 4]

pits:
  - [1, 3]
  - [2, 2]
  - [4, 1]

gold: [3, 3]

scoring:
  gold: 1000
  death: -1000
  step: -1
  shoot: -10

max_steps: 200